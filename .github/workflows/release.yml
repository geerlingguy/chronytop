---
name: Release
'on':
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries.
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARM: '7'
        run: |
          mkdir dist
          for arch in amd64 arm64 arm 386 riscv64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/chronytop-linux-$arch .
          done
          cd dist && sha256sum chronytop-* > SHA256SUMS

      - name: Create release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
