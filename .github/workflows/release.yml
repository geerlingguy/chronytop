---
name: Release
'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries.
        env:
          CGO_ENABLED: '0'
          GOARM: '7'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 \
              darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/chronytop-$os-$arch" .
          done
          cd dist && sha256sum chronytop-* > SHA256SUMS

      - name: Create release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
