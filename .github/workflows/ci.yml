---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "15 3 * * 0"

jobs:
  lint:
    name: Lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting.
        run: test -z "$(gofmt -l .)"

      - name: Vet.
        run: go vet ./...

      - name: Staticcheck.
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Security scan.
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

      - name: Check for known vulnerabilities.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  chronyd:
    name: chronyd (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12  # chrony 4.3
          - debian:13  # chrony 4.6
          - archlinux:latest  # newest chrony release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build integration test binary.
        env:
          CGO_ENABLED: '0'
        run: go test -c -o chronytop-integration.test .
      - name: Install the distribution's chronyd package in a test image.
        run: |
          docker build --tag chronytop-integration \
            --build-arg 'BASE_IMAGE=${{ matrix.image }}' - <<'DOCKERFILE'
          ARG BASE_IMAGE=debian:13
          FROM ${BASE_IMAGE}
          # Prevent package installation from starting chronyd. Debian also
          # needs policy-rc.d for service actions outside systemd.
          RUN mkdir -p /etc/systemd/system && \
              ln -sf /dev/null /etc/systemd/system/chrony.service && \
              ln -sf /dev/null /etc/systemd/system/chronyd.service
          RUN if command -v apt-get >/dev/null; then \
                printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && \
                chmod 755 /usr/sbin/policy-rc.d && \
                apt-get update && \
                DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends chrony; \
              else \
                pacman --sync --refresh --sysupgrade --noconfirm chrony; \
              fi
          DOCKERFILE
      - name: Test chronyd with external networking disabled.
        # Only loopback exists in this container. Each test starts its own
        # daemon with -x and isolated configuration; no clock access is needed.
        run: |
          docker run --rm --network none \
            --volume "$PWD/chronytop-integration.test:/test/chronytop.test:ro" \
            --entrypoint /bin/sh chronytop-integration -ec '
              export CHRONYTOP_TEST_CHRONYD="$(command -v chronyd)"
              test -n "$CHRONYTOP_TEST_CHRONYD"
              /test/chronytop.test -test.run="^TestChronydIntegration$" -test.v -test.timeout=60s
            '

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm, 386, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binary.
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: '7'
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o chronytop-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: chronytop-linux-${{ matrix.arch }}
          path: chronytop-linux-${{ matrix.arch }}
